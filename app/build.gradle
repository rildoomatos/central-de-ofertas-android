plugins {
    id 'com.android.application'
}

android {
    namespace 'com.centraldeofertas.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.centraldeofertas.app'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile(
                    'proguard-android-optimize.txt',
                    'proguard-rules.pro'
            )
        }
    }
}

dependencies {

    // Mantém todas as bibliotecas Kotlin
    // usando a mesma versão e evita
    // o erro de classes duplicadas.
    implementation platform(
            'org.jetbrains.kotlin:kotlin-bom:1.8.22'
    )

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.15.0'
}
